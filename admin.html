<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Dopamine Admin</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:#1e293b;
padding:22px;
border-radius:18px;
margin-bottom:20px;
}

input,button{
padding:12px;
border:0;
border-radius:9px;
font-size:15px;
}

input{
background:#334155;
color:white;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}

.login{
max-width:450px;
margin:80px auto;
}

.login input{
width:100%;
margin-bottom:12px;
}

.login button{
width:100%;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #334155;
text-align:right;
}

.priceInput{
width:130px;
}

.save{
background:#3b82f6;
}

.off{
background:#ef4444;
}

.on{
background:#22c55e;
}

.search{
width:100%;
margin-bottom:20px;
}

.message{
margin-top:15px;
padding:12px;
border-radius:9px;
}

@media(max-width:700px){

table{
font-size:13px;
}

th:nth-child(2),
td:nth-child(2){
display:none;
}

.priceInput{
width:100px;
}

}

</style>

</head>

<body>

<div class="container">

<div
id="login"
class="card login">

<h2>
🔐 لوحة التحكم
</h2>

<input
id="password"
type="password"
placeholder="كلمة مرور الأدمن">

<button
id="loginButton">
دخول
</button>

<div id="loginMessage"></div>

</div>


<div
id="dashboard"
style="display:none">

<div class="card">

<h1>
⚙️ إدارة الأسعار
</h1>

<p>
غيّر سعر البيع واضغط حفظ.
</p>

<input
class="search"
id="search"
placeholder="بحث عن خدمة...">

<button
id="sync">
🔄 تحديث الخدمات من DrD3M
</button>

<div
id="message">
</div>

</div>


<div class="card">

<div
style="overflow-x:auto">

<table>

<thead>

<tr>

<th>الخدمة</th>

<th>سعر DrD3M</th>

<th>سعر البيع</th>

<th>الحالة</th>

<th>حفظ</th>

</tr>

</thead>

<tbody
id="services">
</tbody>

</table>

</div>

</div>

</div>

</div>


<script>

const API =
"https://kwxqjtnfppffuoohlmpl.supabase.co/functions/v1/hyper-worker";

let password = "";

let services = [];


const login =
document.getElementById("login");

const dashboard =
document.getElementById("dashboard");

const passwordInput =
document.getElementById("password");

const loginMessage =
document.getElementById("loginMessage");


async function request(
action,
extra={}
){

const response =
await fetch(API,{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

action,

password,

...extra

})

});

return await response.json();

}


document
.getElementById("loginButton")
.addEventListener(
"click",
async()=>{

password =
passwordInput.value.trim();

if(!password){

loginMessage.textContent =
"أدخل كلمة المرور";

return;

}

const result =
await request("sync");

if(!result.success){

loginMessage.textContent =
"كلمة المرور غير صحيحة";

return;

}

login.style.display =
"none";

dashboard.style.display =
"block";

await loadServices();

}
);


async function loadServices(){

const result =
await request("services");

if(!result.success){

showMessage(
"تعذر تحميل الخدمات"
);

return;

}

services =
result.services || [];

render();

}


function render(){

const search =
document
.getElementById("search")
.value
.toLowerCase();

const tbody =
document
.getElementById("services");

tbody.innerHTML = "";

services
.filter(service =>
String(service.name)
.toLowerCase()
.includes(search)
)
.forEach(service=>{

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>
${escapeHtml(service.name)}
<br>
<small>
ID: ${service.provider_service_id}
</small>
</td>

<td>
${Number(
service.provider_rate
).toFixed(6)}
$
</td>

<td>

<input
class="priceInput"
type="number"
step="0.000001"
min="0"
value="${service.sell_rate}"
data-price="${service.provider_service_id}">

</td>

<td>

<button
class="${service.active ? "on":"off"}"
data-toggle="${service.provider_service_id}"
data-active="${service.active}">

${service.active ? "مفعلة":"متوقفة"}

</button>

</td>

<td>

<button
class="save"
data-save="${service.provider_service_id}">

حفظ

</button>

</td>
`;

tbody.appendChild(tr);

});


document
.querySelectorAll("[data-save]")
.forEach(button=>{

button.addEventListener(
"click",
async()=>{

const id =
button.dataset.save;

const input =
document.querySelector(
`[data-price="${id}"]`
);

const value =
Number(input.value);

if(!Number.isFinite(value)
|| value < 0){

showMessage(
"السعر غير صحيح"
);

return;

}

button.disabled = true;

const result =
await request(
"update_price",
{
service_id:id,
sell_rate:value
}
);

button.disabled = false;

if(!result.success){

showMessage(
result.error ||
"فشل الحفظ"
);

return;

}

showMessage(
"تم حفظ السعر بنجاح ✅"
);

await loadServices();

}
);

});


document
.querySelectorAll("[data-toggle]")
.forEach(button=>{

button.addEventListener(
"click",
async()=>{

const id =
button.dataset.toggle;

const active =
button.dataset.active !== "true";

const result =
await request(
"toggle_service",
{
service_id:id,
active
}
);

if(!result.success){

showMessage(
result.error ||
"فشل التعديل"
);

return;

}

await loadServices();

}
);

});

}


document
.getElementById("search")
.addEventListener(
"input",
render
);


document
.getElementById("sync")
.addEventListener(
"click",
async()=>{

const result =
await request("sync");

if(!result.success){

showMessage(
result.error ||
"فشل تحديث DrD3M"
);

return;

}

showMessage(
"تم تحديث الخدمات من DrD3M ✅"
);

await loadServices();

}
);


function showMessage(text){

const box =
document.getElementById(
"message"
);

box.className =
"message";

box.textContent =
text;

}


function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>

</html>
