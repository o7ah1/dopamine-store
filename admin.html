<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dopamine Store - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
}

.card{
  background:#1e293b;
  padding:25px;
  border-radius:18px;
  margin-bottom:20px;
}

h1{
  text-align:center;
}

input,button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:16px;
}

input{
  background:#334155;
  color:white;
}

button{
  margin-top:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button.logout{
  background:#ef4444;
}

.status{
  text-align:center;
  margin-top:15px;
  color:#94a3b8;
}

.service{
  background:#0f172a;
  padding:18px;
  border-radius:14px;
  margin-top:15px;
}

.service-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.service-info{
  color:#94a3b8;
  font-size:14px;
  margin-bottom:12px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.save{
  background:#3b82f6;
}

.hide{
  background:#f59e0b;
}

.show{
  background:#22c55e;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }
}
.bulk{
  background:#0f172a;
  padding:15px;
  border-radius:14px;
  margin-top:15px;
}

.bulkrow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.bulkrow button{
  margin-top:8px;
  padding:12px 4px;
  background:#8b5cf6;
}

.bulkrow button.reset{
  background:#64748b;
}

@media(max-width:600px){
  .bulkrow{
    grid-template-columns:repeat(2,1fr);
  }
}
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0 5px;
}

.tabs button{
  width:auto;
  margin-top:0;
  padding:10px 14px;
  font-size:15px;
  background:#334155;
}

.tabs button.active{
  background:#22c55e;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginBox">

<h1>🔐 لوحة الإدارة</h1>

<input
  id="password"
  type="password"
  placeholder="كلمة مرور الأدمن">

<button onclick="login()">
دخول
</button>

<div class="status" id="loginStatus"></div>

</div>


<div class="card" id="adminBox" style="display:none">

<h1>⚙️ إدارة الخدمات</h1>

<button class="logout" onclick="logout()">
تسجيل الخروج
</button>

<div class="bulk">
<div class="status" style="margin-top:0">
💹 زيادة كل الأسعار دفعة وحدة (تُحسب من سعر المزود)
</div>
<div class="bulkrow">
<button onclick="bulkMarkup(25)">+25%</button>
<button onclick="bulkMarkup(50)">+50%</button>
<button onclick="bulkMarkup(100)">+100%</button>
<button onclick="bulkMarkup(200)">+200%</button>
<button class="reset" onclick="bulkMarkup(0)">السعر الأصلي</button>
</div>
</div>

<div class="tabs" id="tabs"></div>

<input id="search" placeholder="🔎 ابحث بالاسم أو برقم الخدمة"
  onkeydown="if(event.key==='Enter')searchServices()">

<button onclick="searchServices()">بحث</button>

<button class="save" onclick="syncServices()">
🔄 مزامنة الخدمات من drd3m
</button>

<div class="status" id="status">
جاري تحميل الخدمات...
</div>

<div id="services"></div>

<div class="row" id="pager">
<button onclick="changePage(-1)">السابق</button>
<button onclick="changePage(1)">التالي</button>
</div>

</div>

</div>


<script>

const ADMIN_API =
"https://kwxqjtnfppffuoohlmpl.supabase.co/functions/v1/admin-worker";

let password = "";

let services = [];

const PAGE_SIZE = 100;
let page = 0;
let tab = "";

const TABS = [
  ["","الكل"],
  ["cheap","💰 الأرخص"],
  ["instagram","📸 انستقرام"],
  ["tiktok","🎵 تيك توك"],
  ["youtube","▶️ يوتيوب"],
  ["facebook","👍 فيسبوك"],
  ["twitter","🐦 تويتر"],
  ["telegram","✈️ تيليجرام"],
  ["snapchat","👻 سناب"]
];
let total = 0;


async function api(action, extra = {}){

  const response = await fetch(ADMIN_API,{
    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      action,
      password,
      ...extra
    })
  });

  const data = await response.json();

  if(!response.ok){
    throw new Error(
      data.error || "حدث خطأ"
    );
  }

  return data;
}


async function login(){

  const input =
    document.getElementById("password");

  const status =
    document.getElementById("loginStatus");

  password =
    input.value.trim();

  if(!password){
    status.textContent =
      "اكتب كلمة المرور";
    return;
  }

  status.textContent =
    "جاري التحقق...";

  try{

    await api("services");

    document.getElementById("loginBox")
      .style.display="none";

    document.getElementById("adminBox")
      .style.display="block";

    loadServices();

  }catch(error){

    password="";

    status.textContent =
      error.message;

  }

}


async function loadServices(){

  const status =
    document.getElementById("status");

  try{

    status.textContent =
      "جاري تحميل الخدمات...";

    const result =
      await api("services",{
        search:document.getElementById("search").value.trim(),
        platform:(tab === "cheap" ? "" : tab),
        sort:(tab === "cheap" ? "cheap" : ""),
        limit:PAGE_SIZE,
        offset:page*PAGE_SIZE
      });

    services =
      Array.isArray(result)
        ? result
        : (result.items || []);

    total =
      Array.isArray(result)
        ? result.length
        : (result.total || 0);

    renderServices();

    status.textContent =
      "عرض " +
      (total ? page*PAGE_SIZE+1 : 0) +
      " - " +
      (page*PAGE_SIZE+services.length) +
      " من " + total +
      " خدمة (صفحة " + (page+1) +
      " من " + Math.max(Math.ceil(total/PAGE_SIZE),1) +
      ") ✅";

  }catch(error){

    status.textContent =
      error.message;

  }

}


function renderServices(){

  const box =
    document.getElementById("services");

  box.innerHTML="";


  if(!services.length){

    box.innerHTML =
      "<div class='status'>لا توجد خدمات</div>";

    return;

  }


  services.forEach(service=>{

    const id =
      service.id;

    const name =
      service.name || "بدون اسم";

    const providerRate =
      Number(
        service.provider_rate ??
        service.base_price ??
        0
      );

    const sellRate =
      Number(
        service.sell_rate ??
        providerRate ??
        0
      );

    const active =
      service.active !== false;


    const div =
      document.createElement("div");

    div.className="service";


    div.innerHTML=`

      <div class="service-name">
        ${escapeHtml(name)}
      </div>

      <div class="service-info">
        ID: ${id}
        &nbsp; | &nbsp;
        سعر المزود: ${providerRate}
        &nbsp; | &nbsp;
        الحالة:
        ${active ? "🟢 ظاهرة" : "🔴 مخفية"}
      </div>

      <div class="row">

        <input
          id="price-${id}"
          type="number"
          step="0.000001"
          min="0"
          value="${sellRate}"
          placeholder="سعر البيع">

        <button
          class="save"
          onclick="savePrice(${id})">
          💰 حفظ سعر البيع
        </button>

      </div>

      <button
        class="${active ? "hide" : "show"}"
        onclick="toggleService(${id},${!active})">

        ${active
          ? "👁️ إخفاء الخدمة"
          : "👁️ إظهار الخدمة"}

      </button>

    `;

    box.appendChild(div);

  });

}


async function savePrice(id){

  const input =
    document.getElementById(
      "price-" + id
    );

  const value =
    Number(input.value);


  if(!Number.isFinite(value) || value < 0){

    alert("السعر غير صحيح");

    return;

  }


  try{

    await api(
      "update_price",
      {
        id:id,
        sell_rate:value
      }
    );

    alert(
      "تم حفظ السعر ✅"
    );

    await loadServices();

  }catch(error){

    alert(error.message);

  }

}


async function toggleService(
  id,
  active
){

  try{

    await api(
      "toggle_service",
      {
        id:id,
        active:active
      }
    );

    await loadServices();

  }catch(error){

    alert(error.message);

  }

}


function renderTabs(){

  const box =
    document.getElementById("tabs");

  box.innerHTML = "";

  TABS.forEach(([key,label])=>{

    const b =
      document.createElement("button");

    b.textContent = label;

    if(key === tab)
      b.className = "active";

    b.onclick = ()=>{
      tab = key;
      page = 0;
      renderTabs();
      loadServices();
    };

    box.appendChild(b);

  });

}


function searchServices(){

  page = 0;

  loadServices();

}


function changePage(step){

  const last =
    Math.max(Math.ceil(total/PAGE_SIZE)-1,0);

  page =
    Math.min(Math.max(page+step,0),last);

  loadServices();

  window.scrollTo({top:0,behavior:"smooth"});

}


async function bulkMarkup(percent){

  const msg =
    percent === 0
      ? "إرجاع كل الأسعار لسعر المزود؟"
      : "سعر البيع لكل الخدمات راح يصير: سعر المزود + " + percent + "%\n(هذا يمسح أي أسعار عدلتها يدوياً). متأكد؟";

  if(!confirm(msg))
    return;

  const status =
    document.getElementById("status");

  try{

    status.textContent =
      "جاري تطبيق الزيادة...";

    await api("bulk_markup",{percent});

    await loadServices();

    status.textContent =
      "تم تطبيق " + percent + "% على كل الخدمات ✅";

  }catch(error){

    status.textContent =
      error.message;

  }

}


async function syncServices(){

  const status =
    document.getElementById("status");

  if(!confirm("مزامنة الخدمات من drd3m؟ أسعار البيع الحالية ما تتغير."))
    return;

  try{

    status.textContent =
      "جاري المزامنة... انتظر";

    const r =
      await api("sync",{markup:1.3});

    status.textContent =
      "تمت مزامنة " + r.count + " خدمة ✅";

    await loadServices();

  }catch(error){

    status.textContent =
      error.message;

  }

}


function logout(){

  password="";

  services=[];

  document.getElementById("adminBox")
    .style.display="none";

  document.getElementById("loginBox")
    .style.display="block";

  document.getElementById("password")
    .value="";

  document.getElementById("loginStatus")
    .textContent="";

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

renderTabs();

</script>

</body>
</html>
