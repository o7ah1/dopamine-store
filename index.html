<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dopamine Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
padding:20px
}
.container{
max-width:700px;
margin:auto
}
.card{
background:#1e293b;
padding:20px;
border-radius:15px
}
h1{text-align:center}
label{
display:block;
margin:15px 0 7px
}
select,input,button{
width:100%;
padding:13px;
border-radius:8px;
border:0;
box-sizing:border-box;
font-size:16px
}
select,input{
background:#334155;
color:white
}
button{
margin-top:20px;
background:#22c55e;
color:white;
font-weight:bold
}
#price{
margin-top:20px;
padding:15px;
background:#0f172a;
text-align:center;
font-size:22px
}
#error{
margin-top:15px;
color:#fca5a5;
text-align:center
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚀 Dopamine Store</h1>

<label>الخدمة</label>

<select id="service">
<option>جاري تحميل الخدمات...</option>
</select>

<label>الرابط</label>

<input
id="link"
placeholder="ضع الرابط هنا">

<label>الكمية</label>

<input
id="quantity"
type="number"
placeholder="مثلاً 1000">

<div id="price">
السعر: 0.0000 $
</div>

<button>
إتمام الطلب
</button>

<div id="error"></div>

</div>

</div>

<script>

const API =
"https://kwxqjtnfppffuoohlmpl.supabase.co/functions/v1/hyper-worker";

let services=[];

const serviceBox =
document.getElementById("service");

const quantityBox =
document.getElementById("quantity");

const priceBox =
document.getElementById("price");

const errorBox =
document.getElementById("error");


async function loadServices(){

try{

const response =
await fetch(API,{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
action:"services"
})

});

const result =
await response.json();

console.log(result);

if(!result.success){
throw new Error(
result.error || "API Error"
);
}

services =
Array.isArray(result.data)
? result.data
: [];

if(services.length===0){

throw new Error(
"لم يتم العثور على خدمات"
);

}

serviceBox.innerHTML="";

services.forEach(service=>{

const option =
document.createElement("option");

option.value =
service.service;

option.textContent =
service.name +
" — " +
service.rate +
" $ / 1000";

serviceBox.appendChild(option);

});

updatePrice();

}catch(error){

console.error(error);

serviceBox.innerHTML =
"<option>تعذر تحميل الخدمات</option>";

errorBox.textContent =
error.message;

}

}


function updatePrice(){

const selected =
services.find(
x =>
String(x.service) ===
String(serviceBox.value)
);

if(!selected)return;

const quantity =
Number(
quantityBox.value || 0
);

const rate =
Number(selected.rate || 0);

const total =
rate * quantity / 1000;

priceBox.textContent =
"السعر: " +
total.toFixed(4) +
" $";

}


serviceBox.addEventListener(
"change",
updatePrice
);

quantityBox.addEventListener(
"input",
updatePrice
);

loadServices();

</script>

</body>
</html>
