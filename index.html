<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dopamine Store</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
}

h1{
text-align:center;
}

label{
display:block;
margin:15px 0 7px;
}

select,input,button{
width:100%;
padding:14px;
border-radius:10px;
border:0;
font-size:16px;
}

select,input{
background:#334155;
color:white;
}

button{
margin-top:20px;
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}

.price{
margin-top:20px;
padding:18px;
background:#0f172a;
text-align:center;
font-size:25px;
font-weight:bold;
border-radius:10px;
}

.status{
margin-top:15px;
text-align:center;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚀 Dopamine Store</h1>

<label>الخدمة</label>

<select id="service">
<option>جاري تحميل الخدمات...</option>
</select>

<label>الرابط</label>

<input
id="link"
placeholder="ضع الرابط هنا">

<label>الكمية</label>

<input
id="quantity"
type="number"
placeholder="مثلاً 1000">

<div class="price">
السعر:
<span id="price">0.0000</span> $
</div>

<button>
إتمام الطلب
</button>

<div class="status"
id="status">
</div>

</div>

</div>

<script>

const API =
"https://kwxqjtnfppffuoohlmpl.supabase.co/functions/v1/hyper-worker";

let services = [];

const serviceBox =
document.getElementById("service");

const quantityBox =
document.getElementById("quantity");

const priceBox =
document.getElementById("price");

const statusBox =
document.getElementById("status");


async function loadServices(){

try{

const response =
await fetch(API,{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
action:"services"
})
});

const result =
await response.json();

if(!result.success){
throw new Error(
result.error
);
}

services =
result.services || [];

serviceBox.innerHTML="";

services.forEach(service=>{

const option =
document.createElement("option");

option.value =
service.provider_service_id;

option.textContent =
service.name;

serviceBox.appendChild(option);

});

updatePrice();

statusBox.textContent =
"الخدمات محدثة";

}catch(error){

console.error(error);

statusBox.textContent =
"تعذر تحميل الخدمات";

}

}


function selectedService(){

return services.find(
x =>
String(
x.provider_service_id
) ===
String(
serviceBox.value
)
);

}


function updatePrice(){

const service =
selectedService();

const quantity =
Number(
quantityBox.value || 0
);

if(!service){
priceBox.textContent =
"0.0000";
return;
}

const rate =
Number(
service.sell_rate || 0
);

/*
  السعر محسوب لكل 1000
*/

const total =
rate *
quantity /
1000;

priceBox.textContent =
total.toFixed(4);

}


serviceBox.addEventListener(
"change",
updatePrice
);

quantityBox.addEventListener(
"input",
updatePrice
);


/*
  تحديث تلقائي كل 3 ثواني
*/

setInterval(
loadServices,
3000
);

loadServices();

</script>

</body>
</html>
