<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dopamine Store</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#0f172a;
    color:#fff;
}
.container{
    width:95%;
    max-width:900px;
    margin:30px auto;
}
.header{
    text-align:center;
    margin-bottom:25px;
}
.header h1{
    margin:0;
    font-size:32px;
}
.header p{
    color:#94a3b8;
}
.card{
    background:#1e293b;
    padding:22px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}
label{
    display:block;
    margin:15px 0 7px;
}
select,input{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#334155;
    color:#fff;
    font-size:16px;
    outline:none;
}
select option{
    background:#1e293b;
}
.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}
.box{
    background:#334155;
    padding:15px;
    border-radius:10px;
    text-align:center;
}
.box small{
    color:#94a3b8;
}
.box strong{
    display:block;
    margin-top:6px;
}
.price{
    margin-top:20px;
    padding:20px;
    border-radius:12px;
    background:#0f172a;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}
button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{
    background:#64748b;
    cursor:not-allowed;
}
.message{
    margin-top:15px;
    text-align:center;
    padding:12px;
    border-radius:10px;
    display:none;
}
.loading{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}
@media(max-width:600px){
    .info{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚀 Dopamine Store</h1>
        <p>خدمات السوشيال ميديا</p>
    </div>

    <div class="card">

        <div id="loading" class="loading">
            جاري تحميل الخدمات...
        </div>

        <div id="form" style="display:none">

            <label>اختر الخدمة</label>

            <select id="service"></select>

            <div class="info">

                <div class="box">
                    <small>الحد الأدنى</small>
                    <strong id="min">-</strong>
                </div>

                <div class="box">
                    <small>الحد الأقصى</small>
                    <strong id="max">-</strong>
                </div>

                <div class="box">
                    <small>السعر / 1000</small>
                    <strong id="rate">-</strong>
                </div>

            </div>

            <label>الرابط</label>

            <input
                id="link"
                type="url"
                placeholder="ضع رابط الحساب أو المنشور"
            >

            <label>الكمية</label>

            <input
                id="quantity"
                type="number"
                placeholder="مثلاً 1000"
            >

            <div class="price">
                السعر:
                <span id="price">0.0000</span> $
            </div>

            <button id="orderButton">
                إتمام الطلب
            </button>

            <div id="message" class="message"></div>

        </div>

    </div>

</div>

<script>

const API =
"https://kwxqjtnfppffuoohlmpl.supabase.co/functions/v1/hyper-worker";

let services = [];

const serviceSelect =
document.getElementById("service");

const quantityInput =
document.getElementById("quantity");

const linkInput =
document.getElementById("link");

const priceElement =
document.getElementById("price");

const minElement =
document.getElementById("min");

const maxElement =
document.getElementById("max");

const rateElement =
document.getElementById("rate");

const messageElement =
document.getElementById("message");

function showMessage(text, type="normal") {

    messageElement.style.display = "block";
    messageElement.textContent = text;

    if(type === "error"){
        messageElement.style.background = "#7f1d1d";
    }else if(type === "success"){
        messageElement.style.background = "#166534";
    }else{
        messageElement.style.background = "#334155";
    }
}

async function loadServices(){

    try{

        const response = await fetch(API,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                action:"services"
            })
        });

        const data = await response.json();

        if(!data.success){
            throw new Error(data.error || "فشل تحميل الخدمات");
        }

        services =
            Array.isArray(data.services)
            ? data.services
            : [];

        serviceSelect.innerHTML = "";

        services.forEach(service => {

            const option =
            document.createElement("option");

            option.value = service.service;

            option.textContent =
                service.name;

            serviceSelect.appendChild(option);

        });

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("form")
            .style.display = "block";

        updateService();

    }catch(error){

        document.getElementById("loading")
            .textContent =
            "تعذر تحميل الخدمات. حاول تحديث الصفحة.";

        console.error(error);

    }
}

function getSelectedService(){

    const id =
        String(serviceSelect.value);

    return services.find(
        service =>
        String(service.service) === id
    );

}

function updateService(){

    const service =
        getSelectedService();

    if(!service) return;

    const rate =
        Number(
            service.sell_rate ??
            service.rate ??
            0
        );

    minElement.textContent =
        Number(service.min || 0).toLocaleString();

    maxElement.textContent =
        Number(service.max || 0).toLocaleString();

    rateElement.textContent =
        rate.toFixed(6) + " $";

    updatePrice();
}

function updatePrice(){

    const service =
        getSelectedService();

    if(!service){

        priceElement.textContent =
            "0.0000";

        return;
    }

    const quantity =
        Number(quantityInput.value || 0);

    const rate =
        Number(
            service.sell_rate ??
            service.rate ??
            0
        );

    const total =
        rate * quantity / 1000;

    priceElement.textContent =
        total.toFixed(4);
}

serviceSelect.addEventListener(
    "change",
    updateService
);

quantityInput.addEventListener(
    "input",
    updatePrice
);

document
.getElementById("orderButton")
.addEventListener("click", async function(){

    const service =
        getSelectedService();

    const link =
        linkInput.value.trim();

    const quantity =
        Number(quantityInput.value);

    if(!service){
        showMessage(
            "اختر الخدمة أولاً",
            "error"
        );
        return;
    }

    if(!link){
        showMessage(
            "أدخل الرابط",
            "error"
        );
        return;
    }

    if(!quantity || quantity <= 0){
        showMessage(
            "أدخل كمية صحيحة",
            "error"
        );
        return;
    }

    const min =
        Number(service.min || 0);

    const max =
        Number(service.max || 999999999);

    if(quantity < min){

        showMessage(
            "الكمية أقل من الحد الأدنى: " +
            min.toLocaleString(),
            "error"
        );

        return;
    }

    if(quantity > max){

        showMessage(
            "الكمية أكبر من الحد الأقصى: " +
            max.toLocaleString(),
            "error"
        );

        return;
    }

    const rate =
        Number(
            service.sell_rate ??
            service.rate ??
            0
        );

    const total =
        rate * quantity / 1000;

    showMessage(
        "السعر النهائي: " +
        total.toFixed(4) +
        " $",
        "normal"
    );

    /*
      الدفع سيتم ربطه هنا.
      لا يتم إرسال طلب DrD3M قبل تأكيد الدفع.
    */

});

loadServices();

</script>

</body>
</html>
