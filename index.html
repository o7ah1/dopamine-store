<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dopamine Store</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F5F3FF;
  --surface:#FFFFFF;
  --field:#FAF9FF;
  --ink:#17123B;
  --muted:#6A6690;
  --line:#E3DFF6;
  --primary:#5A3CF0;
  --summary:#5A3CF0;
  --hit:#FFD23F;
  --on-hit:#17123B;
  --danger:#D92D4A;
  --shadow:0 1px 0 rgba(23,18,59,.04),0 28px 50px -30px rgba(90,60,240,.35);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#0D0A22;
    --surface:#171338;
    --field:#110E2D;
    --ink:#F2EFFF;
    --muted:#A5A0CE;
    --line:#2D2766;
    --primary:#7B61FF;
    --summary:#4A32D9;
    --danger:#FF7A90;
    --shadow:none;
  }
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:"Readex Pro",Tahoma,Arial,sans-serif;
  font-size:16px;
  line-height:1.6;
  padding:20px 16px 48px;
}

.shell{
  max-width:1040px;
  margin:0 auto;
}

/* ---------- الرأس ---------- */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:8px 4px 24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:26px;
  font-weight:700;
  letter-spacing:-.01em;
  direction:ltr;
}

.brand .mark{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--hit);
  color:var(--on-hit);
  display:grid;
  place-items:center;
}

.brand .mark svg{width:24px;height:24px}

.brand small{
  font-weight:300;
  font-size:26px;
  color:var(--muted);
  margin-left:-6px;
}

.top p{
  margin:0;
  color:var(--muted);
  font-size:15px;
}

/* ---------- التخطيط ---------- */
.layout{
  display:grid;
  gap:20px;
  align-items:start;
}

@media(min-width:900px){
  .layout{
    grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);
    gap:28px;
  }
  .summary{
    position:sticky;
    top:20px;
  }
}

.steps{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:28px;
  padding:8px 24px;
  box-shadow:var(--shadow);
}

.step{
  padding:22px 0;
}

.step + .step{
  border-top:1px solid var(--line);
}

.step h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 14px;
  font-size:17px;
  font-weight:600;
}

.step h2 b{
  width:26px;
  height:26px;
  border-radius:9px;
  background:var(--ink);
  color:var(--surface);
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:600;
}

/* ---------- المنصات ---------- */
.platforms{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:2px 2px 10px;
  margin:0 -2px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.platforms::-webkit-scrollbar{display:none}

@media(min-width:720px){
  .platforms{
    flex-wrap:wrap;
    overflow:visible;
    padding-bottom:2px;
  }
}

.plat{
  flex:0 0 auto;
  scroll-snap-align:start;
  width:86px;
  padding:12px 6px 10px;
  border:1.5px solid var(--line);
  border-radius:18px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-size:13px;
  font-weight:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  transition:border-color .15s,background-color .15s;
}

.plat:hover{border-color:var(--primary)}

.plat[aria-pressed="true"]{
  border-color:var(--primary);
  background:var(--surface);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent);
  font-weight:600;
}

.plat .ico{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  line-height:1;
  color:#fff;
}

/* ---------- الحقول ---------- */
.field{margin-top:12px}
.field:first-of-type{margin-top:0}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:500;
  color:var(--muted);
}

input,select{
  width:100%;
  height:52px;
  padding:0 16px;
  border:1.5px solid var(--line);
  border-radius:14px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-size:16px;
  transition:border-color .15s,box-shadow .15s;
}

input::placeholder{color:var(--muted);opacity:.7}

input:focus-visible,
select:focus-visible{
  outline:0;
  border-color:var(--primary);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent);
}

input[aria-invalid="true"],
select[aria-invalid="true"]{
  border-color:var(--danger);
}

/* قائمة الخدمات (بدل select الأصلي عشان الأسماء الطويلة ما تطلع برا الصفحة) */
.combo{position:relative}

.combo-btn{
  width:100%;
  min-height:52px;
  padding:9px 16px 9px 44px;
  border:1.5px solid var(--line);
  border-radius:14px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-size:15.5px;
  text-align:start;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
}

.combo-btn:focus-visible,
.combo-btn[aria-expanded="true"]{
  outline:0;
  border-color:var(--primary);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent);
}

.combo-btn[aria-invalid="true"]{border-color:var(--danger)}

.combo-text{
  flex:1;
  min-width:0;
  line-height:1.45;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow-wrap:anywhere;
}

.combo > svg{
  position:absolute;
  left:16px;
  top:26px;
  width:18px;
  height:18px;
  margin-top:-9px;
  color:var(--muted);
  pointer-events:none;
}

.p{
  flex:0 0 auto;
  min-width:62px;
  padding:2px 9px;
  border-radius:999px;
  background:color-mix(in srgb,var(--hit) 55%,transparent);
  color:var(--ink);
  font-size:13px;
  font-weight:600;
  text-align:center;
  direction:ltr;
  font-variant-numeric:tabular-nums;
}

.combo-panel{
  position:absolute;
  z-index:30;
  inset-inline:0;
  top:calc(100% + 8px);
  max-height:min(380px,55vh);
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:6px;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:16px;
  box-shadow:0 24px 48px -16px rgba(23,18,59,.4);
}

.combo-panel[hidden]{display:none}

.opt{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  font-size:15px;
  line-height:1.5;
  cursor:pointer;
}

.opt .n{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.opt.active{
  background:color-mix(in srgb,var(--primary) 12%,transparent);
}

.opt[aria-selected="true"]{
  background:color-mix(in srgb,var(--primary) 20%,transparent);
  font-weight:500;
}

.grp{
  position:sticky;
  top:-6px;
  z-index:1;
  padding:10px 12px 6px;
  background:var(--surface);
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
}

.note{
  margin-top:8px;
  min-height:22px;
  font-size:13.5px;
  color:var(--muted);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.chip{
  padding:8px 14px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:transparent;
  color:var(--ink);
  font:inherit;
  font-size:14px;
  cursor:pointer;
  transition:border-color .15s,background-color .15s;
}

.chip:hover{border-color:var(--primary)}

/* ---------- نوع الخدمة ---------- */
.types{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:0 0 4px;
}

.types .chip{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 13px;
  background:var(--field);
  font-size:14px;
}

.types .chip .c{
  padding:0 7px;
  border-radius:999px;
  background:color-mix(in srgb,var(--ink) 9%,transparent);
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  direction:ltr;
  font-variant-numeric:tabular-nums;
}

.types .chip[aria-pressed="true"]{
  border-color:var(--primary);
  background:color-mix(in srgb,var(--primary) 14%,transparent);
  font-weight:600;
}

.types .chip[aria-pressed="true"] .c{
  background:var(--primary);
  color:#fff;
}

.chip:focus-visible,
.plat:focus-visible,
.order:focus-visible{
  outline:3px solid var(--primary);
  outline-offset:2px;
}

/* ---------- ملخص الطلب ---------- */
.summary{
  background:var(--summary);
  color:#fff;
  border-radius:28px;
  padding:26px 24px 24px;
}

.summary .label{
  font-size:14px;
  opacity:.8;
}

.price{
  display:flex;
  align-items:baseline;
  gap:6px;
  margin:4px 0 12px;
  direction:ltr;
  justify-content:flex-end;
  font-variant-numeric:tabular-nums;
}

.price .cur{
  font-size:28px;
  font-weight:500;
  opacity:.8;
}

.price #price{
  font-size:clamp(44px,9vw,60px);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.05;
  overflow-wrap:anywhere;
}

.rate{
  display:inline-block;
  padding:5px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  font-size:13.5px;
}

.facts{
  margin:20px 0 0;
  padding:16px 0 0;
  border-top:1px solid rgba(255,255,255,.22);
  display:grid;
  gap:10px;
}

.facts div{
  display:flex;
  justify-content:space-between;
  gap:16px;
  font-size:14px;
}

.facts dt{opacity:.75;flex:0 0 auto}

.facts dd{
  margin:0;
  text-align:left;
  font-weight:500;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.order{
  width:100%;
  height:56px;
  margin-top:22px;
  border:0;
  border-radius:16px;
  background:var(--hit);
  color:var(--on-hit);
  font:inherit;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  transition:transform .12s;
}

.order:active{transform:scale(.985)}

.order:focus-visible{outline-color:#fff}

.msg{
  min-height:24px;
  margin-top:12px;
  font-size:14px;
  text-align:center;
}

.msg.error{color:#FFD1D8}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>
</head>

<body>

<div class="shell">

  <header class="top">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 1.5l2.6 7.4 7.4 2.6-7.4 2.6L12 21.5l-2.6-7.4L2 11.5l7.4-2.6z"/>
        </svg>
      </span>
      Dopamine<small>Store</small>
    </div>
    <p>اختر المنصة، ثم نوع الخدمة، ثم الخدمة والرابط والكمية.</p>
  </header>

  <main class="layout">

    <section class="steps">

      <div class="step">
        <h2><b>1</b> المنصة</h2>
        <div class="platforms" id="tabs"></div>
      </div>

      <div class="step">
        <h2><b>2</b> الخدمة</h2>

        <div class="field">
          <label>نوع الخدمة</label>
          <div class="types" id="types" role="group" aria-label="نوع الخدمة"></div>
        </div>

        <div class="field" id="searchField" hidden>
          <label for="search">بحث</label>
          <input
            id="search"
            type="search"
            placeholder="ابحث باسم الخدمة"
            autocomplete="off">
        </div>

        <div class="field">
          <label for="catBtn">القسم</label>
          <div class="combo" id="catCombo">
            <button
              type="button"
              class="combo-btn"
              id="catBtn"
              aria-haspopup="listbox"
              aria-expanded="false">
              <span class="combo-text" id="catText">كل الأقسام</span>
            </button>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            <div class="combo-panel" id="catPanel" role="listbox" hidden></div>
          </div>
        </div>

        <div class="field">
          <label for="serviceBtn">اختر الخدمة</label>
          <div class="combo" id="combo">
            <button
              type="button"
              class="combo-btn"
              id="serviceBtn"
              aria-haspopup="listbox"
              aria-expanded="false">
              <span class="p" id="servicePrice" hidden></span>
              <span class="combo-text" id="serviceText">جاري تحميل الخدمات...</span>
            </button>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            <div class="combo-panel" id="servicePanel" role="listbox" hidden></div>
          </div>
          <div class="note" id="status"></div>
        </div>
      </div>

      <div class="step">
        <h2><b>3</b> الرابط والكمية</h2>

        <div class="field">
          <label for="link">الرابط</label>
          <input
            id="link"
            type="url"
            dir="ltr"
            inputmode="url"
            autocapitalize="off"
            autocomplete="off"
            placeholder="https://">
        </div>

        <div class="field">
          <label for="quantity">الكمية</label>
          <input
            id="quantity"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="مثلاً 1000">
          <div class="chips" id="chips"></div>
        </div>
      </div>

    </section>

    <aside class="summary" aria-live="polite">
      <div class="label">الإجمالي</div>

      <div class="price">
        <span id="price">0.00</span>
        <span class="cur">$</span>
      </div>

      <span class="rate" id="rateHint">اختر خدمة لعرض السعر</span>

      <dl class="facts">
        <div><dt>الخدمة</dt><dd id="sumService">—</dd></div>
        <div><dt>الكمية</dt><dd id="sumQty">—</dd></div>
      </dl>

      <button class="order" id="orderBtn" type="button">إتمام الطلب</button>

      <div class="msg" id="orderMsg"></div>
    </aside>

  </main>

</div>

<script>

/* الخدمات تجي من دالة admin-worker (إجراء عام يرجع الاسم والقسم وسعر البيع فقط) */
const API =
  "https://kwxqjtnfppffuoohlmpl.supabase.co/functions/v1/admin-worker";

/* [المفتاح, الاسم, الأيقونة, لون الأيقونة] */
const TABS = [
  ["cheap","الأرخص","💰","#FFD23F"],
  ["instagram","انستقرام","📸","linear-gradient(135deg,#F9A03F,#E1306C 55%,#833AB4)"],
  ["tiktok","تيك توك","🎵","#111111"],
  ["youtube","يوتيوب","▶","#F0243A"],
  ["facebook","فيسبوك","👍","#1877F2"],
  ["twitter","تويتر","🐦","#0F1419"],
  ["telegram","تيليجرام","✈️","#229ED9"],
  ["snapchat","سناب","👻","#FFFC00"],
  ["all","كل الخدمات","🔎","#5A3CF0"]
];

const QUICK = [100,500,1000,5000,10000];

/* أنواع الخدمات: يتم التعرف عليها من اسم الخدمة أو اسم القسم */
const TYPES = [
  ["followers","متابعين","👥",/متابع|فولو|follow|subscriber|مشترك|اشتراك|عضو|أعضاء|اعضاء|member/i],
  ["likes","لايكات","❤️",/لايك|إعجاب|اعجاب|like|reaction|تفاعل/i],
  ["views","مشاهدات","👁",/مشاهد|شاهد|view|بلاي|play|impression|ظهور|وصول|reach/i],
  ["comments","تعليقات","💬",/تعليق|كومنت|comment/i],
  ["shares","مشاركات","🔁",/مشارك|share|ريتويت|retweet|إعادة نشر|repost|حفظ|save|story|ستوري/i],
  ["votes","تصويت","📊",/تصويت|فوت|vote|poll|استطلاع/i]
];

const QUICK_TYPE_FALLBACK = ["other","أخرى","✨",null];

let tab = "cheap";
let selectedType = "all";
let selectedCat = "all";
let catOptionEls = [];
let catOpen = false;
let allServices = [];
let services = [];
let requestId = 0;
let searchTimer = null;
let selectedId = null;
let optionEls = [];
let activeIndex = -1;
let isOpen = false;

const $ = id => document.getElementById(id);

const tabsBox     = $("tabs");
const typesBox    = $("types");
const searchBox   = $("search");
const searchField = $("searchField");
const catBtn      = $("catBtn");
const catText     = $("catText");
const catPanel    = $("catPanel");
const catCombo    = $("catCombo");
const serviceBtn   = $("serviceBtn");
const serviceText  = $("serviceText");
const servicePrice = $("servicePrice");
const servicePanel = $("servicePanel");
const combo        = $("combo");
const linkBox     = $("link");
const quantityBox = $("quantity");
const priceBox    = $("price");
const statusBox   = $("status");
const rateHint    = $("rateHint");
const sumService  = $("sumService");
const sumQty      = $("sumQty");
const orderMsg    = $("orderMsg");


function renderTabs(){

  /* البحث بالاسم يظهر فقط في قسم "كل الخدمات" */
  searchField.hidden = tab !== "all";

  tabsBox.innerHTML = "";

  TABS.forEach(([key,label,icon,bg])=>{

    const b = document.createElement("button");

    b.type = "button";
    b.className = "plat";
    b.setAttribute("aria-pressed", String(key === tab));

    const ico = document.createElement("span");
    ico.className = "ico";
    ico.style.background = bg;
    ico.textContent = icon;

    if(key === "snapchat" || key === "cheap"){
      ico.style.color = "#17123B";
    }

    const text = document.createElement("span");
    text.textContent = label;

    b.append(ico,text);

    b.onclick = ()=>{
      tab = key;
      selectedCat = "all";
      renderTabs();
      loadServices();
      if(key === "all"){
        searchBox.focus();
      }
    };

    tabsBox.appendChild(b);

  });

}


/* نحدد نوع الخدمة من اسمها (ومن اسم القسم إذا الاسم ما وضّح) */
function typeOf(service){

  const text =
    (service.name || "") + " " + (service.category || "");

  const found = TYPES.find(([,,,re]) => re.test(text));

  return found ? found[0] : "other";

}


function typeLabel(key){

  const found = TYPES.find(([k]) => k === key);

  return found || QUICK_TYPE_FALLBACK;

}


function renderTypes(){

  typesBox.innerHTML = "";

  /* نعد كم خدمة بكل نوع حسب القسم المفتوح حالياً */
  const counts = new Map();

  allServices.forEach(service=>{

    const key = typeOf(service);

    counts.set(key,(counts.get(key) || 0) + 1);

  });

  if(!allServices.length){

    selectedType = "all";

    return;

  }

  /* إذا النوع المختار ما عنده خدمات بهذا القسم نرجع للكل */
  if(selectedType !== "all" && !counts.has(selectedType)){
    selectedType = "all";
  }

  const list = [["all","الكل","✳️",allServices.length]];

  TYPES.forEach(([key,label,icon])=>{
    if(counts.has(key)){
      list.push([key,label,icon,counts.get(key)]);
    }
  });

  if(counts.has("other")){
    list.push([
      "other",
      QUICK_TYPE_FALLBACK[1],
      QUICK_TYPE_FALLBACK[2],
      counts.get("other")
    ]);
  }

  list.forEach(([key,label,icon,count])=>{

    const b = document.createElement("button");

    b.type = "button";
    b.className = "chip";
    b.setAttribute("aria-pressed", String(key === selectedType));

    const t = document.createElement("span");
    t.textContent = icon + " " + label;

    const c = document.createElement("span");
    c.className = "c";
    c.textContent = count.toLocaleString("en-US");

    b.append(t,c);

    b.onclick = ()=>{

      selectedType = key;

      renderTypes();

      applyFilters();

    };

    typesBox.appendChild(b);

  });

}


/* الخدمات المطابقة للنوع المختار فقط (قبل فلتر القسم) */
function byType(){

  return selectedType === "all"
    ? allServices.slice()
    : allServices.filter(s => typeOf(s) === selectedType);

}


function catOf(service){

  return service.category || "أخرى";

}


/* قائمة الأقسام تُبنى من الخدمات نفسها */
function renderCats(list){

  catPanel.innerHTML = "";

  catOptionEls = [];

  closeCatPanel();

  const counts = new Map();

  list.forEach(service=>{

    const name = catOf(service);

    counts.set(name,(counts.get(name) || 0) + 1);

  });

  /* إذا القسم المختار ما عاد موجود نرجع للكل */
  if(selectedCat !== "all" && !counts.has(selectedCat)){
    selectedCat = "all";
  }

  if(!counts.size){

    catText.textContent = "لا توجد أقسام";

    return;

  }

  const rows = [["all","كل الأقسام",list.length]];

  [...counts.keys()]
    .sort((a,b)=>a.localeCompare(b,"ar"))
    .forEach(name=>{
      rows.push([name,name,counts.get(name)]);
    });

  rows.forEach(([value,label,count])=>{

    const el = document.createElement("div");

    el.className = "opt";
    el.dataset.value = value;
    el.setAttribute("role","option");
    el.setAttribute("aria-selected",String(value === selectedCat));

    const c = document.createElement("span");
    c.className = "p";
    c.textContent = count.toLocaleString("en-US");

    const n = document.createElement("span");
    n.className = "n";
    n.textContent = label;

    el.append(c,n);

    catPanel.appendChild(el);

    catOptionEls.push(el);

  });

  catText.textContent =
    selectedCat === "all" ? "كل الأقسام" : selectedCat;

}


function openCatPanel(){

  if(!catOptionEls.length) return;

  catOpen = true;

  catPanel.hidden = false;

  catBtn.setAttribute("aria-expanded","true");

  const el = catOptionEls.find(
    e => e.dataset.value === selectedCat
  );

  if(el) el.scrollIntoView({block:"nearest"});

}


function closeCatPanel(){

  catOpen = false;

  catPanel.hidden = true;

  catBtn.setAttribute("aria-expanded","false");

}


function chooseCat(value){

  selectedCat = value;

  closeCatPanel();

  applyFilters();

  catBtn.focus();

}


/* نطبّق فلتر النوع ثم القسم على الخدمات القادمة من الخادم */
function applyFilters(){

  const list = byType();

  renderCats(list);

  services =
    selectedCat === "all"
      ? list
      : list.filter(s => catOf(s) === selectedCat);

  renderServices();

}


function renderChips(){

  const box = $("chips");

  QUICK.forEach(n=>{

    const b = document.createElement("button");

    b.type = "button";
    b.className = "chip";
    b.textContent = n.toLocaleString("en-US");

    b.onclick = ()=>{
      quantityBox.value = n;
      clearInvalid(quantityBox);
      updatePrice();
    };

    box.appendChild(b);

  });

}


async function loadServices(){

  const myRequest = ++requestId;

  statusBox.textContent = "جاري تحميل الخدمات...";

  setMessage("جاري تحميل الخدمات...");

  try{

    const response = await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        action:"public_services",
        platform:tab,
        search:searchBox.value.trim()
      })
    });

    const result = await response.json();

    /* تجاهل الردود القديمة إذا المستخدم غيّر القسم بسرعة */
    if(myRequest !== requestId) return;

    if(!response.ok){
      throw new Error(result.error || ("HTTP " + response.status));
    }

    allServices = Array.isArray(result.items) ? result.items : [];

    renderTypes();

    applyFilters();

  }catch(error){

    if(myRequest !== requestId) return;

    console.error("LOAD SERVICES ERROR:", error);

    allServices = [];

    services = [];

    renderTypes();

    renderCats([]);

    setMessage("تعذر تحميل الخدمات");

    statusBox.textContent =
      "تعذر تحميل الخدمات. حدّث الصفحة وحاول مرة ثانية.";

    updatePrice();

  }

}


function fmtRate(service){

  const rate = Number(service.sell_rate || 0);

  return "$" + (
    rate >= 1
      ? rate.toFixed(2)
      : String(Number(rate.toFixed(4)))
  );

}


function setMessage(text){

  servicePrice.hidden = true;

  serviceText.textContent = text;

}


function selectedService(){

  return services.find(service =>
    String(service.id) === String(selectedId)
  );

}


function refreshSelection(){

  optionEls.forEach(el=>{
    el.setAttribute(
      "aria-selected",
      String(el.dataset.id === String(selectedId))
    );
  });

  const service = selectedService();

  if(!service) return;

  servicePrice.hidden = false;

  servicePrice.textContent = fmtRate(service);

  serviceText.textContent =
    service.name || "خدمة بدون اسم";

}


function setActive(i){

  if(!optionEls.length) return;

  activeIndex = Math.max(0,Math.min(i,optionEls.length-1));

  optionEls.forEach((el,k)=>{
    el.classList.toggle("active",k === activeIndex);
  });

  const el = optionEls[activeIndex];

  serviceBtn.setAttribute("aria-activedescendant",el.id);

  el.scrollIntoView({block:"nearest"});

}


function openPanel(){

  if(!optionEls.length) return;

  isOpen = true;

  servicePanel.hidden = false;

  serviceBtn.setAttribute("aria-expanded","true");

  const i = optionEls.findIndex(
    el => el.dataset.id === String(selectedId)
  );

  setActive(i >= 0 ? i : 0);

}


function closePanel(){

  isOpen = false;

  servicePanel.hidden = true;

  serviceBtn.setAttribute("aria-expanded","false");

  serviceBtn.removeAttribute("aria-activedescendant");

}


function chooseService(id){

  selectedId = id;

  refreshSelection();

  clearInvalid(serviceBtn);

  updatePrice();

  closePanel();

  serviceBtn.focus();

}


function addOption(service){

  const el = document.createElement("div");

  el.className = "opt";
  el.id = "opt-" + service.id;
  el.dataset.id = service.id;
  el.setAttribute("role","option");
  el.setAttribute("aria-selected","false");

  const p = document.createElement("span");
  p.className = "p";
  p.textContent = fmtRate(service);

  const n = document.createElement("span");
  n.className = "n";
  n.textContent = service.name || "خدمة بدون اسم";

  el.append(p,n);

  servicePanel.appendChild(el);

  optionEls.push(el);

}


function renderServices(){

  servicePanel.innerHTML = "";

  optionEls = [];

  closePanel();

  if(!services.length){

    selectedId = null;

    const needSearch =
      tab === "all" && searchBox.value.trim().length < 2;

    setMessage(
      needSearch
        ? "اكتب اسم الخدمة في خانة البحث"
        : (
          selectedType !== "all" && allServices.length
            ? "لا توجد " + typeLabel(selectedType)[1] + " في هذا القسم"
            : "لا توجد خدمات مطابقة"
          )
    );

    statusBox.textContent = "";

    updatePrice();

    return;

  }

  if(tab === "cheap" || tab === "all"){

    /* الأرخص والبحث: قائمة وحدة مرتبة */
    services.forEach(addOption);

  }else{

    /* أقسام المنصات: الخدمات مجمّعة حسب النوع داخل القسم */
    const groups = new Map();

    services.forEach(service=>{

      const name = service.category || "أخرى";

      if(!groups.has(name)){
        groups.set(name,[]);
      }

      groups.get(name).push(service);

    });

    groups.forEach((list,name)=>{

      const head = document.createElement("div");

      head.className = "grp";
      head.setAttribute("role","presentation");
      head.textContent = name;

      servicePanel.appendChild(head);

      list.forEach(addOption);

    });

  }

  if(!services.some(s => String(s.id) === String(selectedId))){
    selectedId = services[0].id;
  }

  refreshSelection();

  statusBox.textContent =
    services.length.toLocaleString("en-US") +
    " خدمة متاحة، والسعر بجانب كل خدمة لكل 1000";

  clearInvalid(serviceBtn);

  updatePrice();

}


function money(n){

  return n < 1 ? n.toFixed(4) : n.toFixed(2);

}


function updatePrice(){

  const service = selectedService();

  const quantity = Number(quantityBox.value || 0);

  if(!service){

    priceBox.textContent = "0.00";

    rateHint.textContent = "اختر خدمة لعرض السعر";

    sumService.textContent = "—";

    sumQty.textContent = quantity
      ? quantity.toLocaleString("en-US")
      : "—";

    return;

  }

  const rate = Number(service.sell_rate || 0);

  /* السعر محسوب لكل 1000 */
  const total = rate * quantity / 1000;

  priceBox.textContent = money(total);

  rateHint.textContent =
    "السعر لكل 1000: $" + Number(rate.toFixed(4));

  sumService.textContent =
    service.name || "خدمة بدون اسم";

  sumQty.textContent = quantity
    ? quantity.toLocaleString("en-US")
    : "—";

}


function clearInvalid(el){

  el.removeAttribute("aria-invalid");

}


function showMessage(text,isError){

  orderMsg.textContent = text;

  orderMsg.className = isError ? "msg error" : "msg";

}


function submitOrder(){

  const service = selectedService();

  const link = linkBox.value.trim();

  const quantity = Number(quantityBox.value);

  showMessage("",false);

  if(!service){

    serviceBtn.setAttribute("aria-invalid","true");

    serviceBtn.focus();

    showMessage("اختر الخدمة أولاً",true);

    return;

  }

  if(!/^https?:\/\/\S+\.\S+/i.test(link)){

    linkBox.setAttribute("aria-invalid","true");

    linkBox.focus();

    showMessage("اكتب رابطاً صحيحاً يبدأ بـ https://",true);

    return;

  }

  if(!Number.isFinite(quantity) || quantity < 1){

    quantityBox.setAttribute("aria-invalid","true");

    quantityBox.focus();

    showMessage("اكتب الكمية",true);

    return;

  }

  /*
    هنا يتم إرسال الطلب لدالة الدفع (create-order)
    بعد ربط بوابة الدفع.
  */
  showMessage("بيانات الطلب صحيحة. الدفع غير مفعّل بعد، حاول لاحقاً.",false);

}


catBtn.addEventListener("click",()=>{
  catOpen ? closeCatPanel() : openCatPanel();
});

catBtn.addEventListener("keydown",e=>{

  if(e.key === "ArrowDown" && !catOpen){
    e.preventDefault();
    openCatPanel();
  }else if(e.key === "Escape" && catOpen){
    e.preventDefault();
    closeCatPanel();
  }

});

catPanel.addEventListener("mousedown",e=>{
  e.preventDefault();
});

catPanel.addEventListener("click",e=>{

  const el = e.target.closest(".opt");

  if(el) chooseCat(el.dataset.value);

});

document.addEventListener("click",e=>{

  if(catOpen && !catCombo.contains(e.target)){
    closeCatPanel();
  }

});

serviceBtn.addEventListener("click",()=>{
  isOpen ? closePanel() : openPanel();
});

serviceBtn.addEventListener("keydown",e=>{

  if(e.key === "ArrowDown" || e.key === "ArrowUp"){

    e.preventDefault();

    if(!isOpen){
      openPanel();
      return;
    }

    setActive(activeIndex + (e.key === "ArrowDown" ? 1 : -1));

  }else if(e.key === "Enter" && isOpen){

    e.preventDefault();

    const el = optionEls[activeIndex];

    if(el) chooseService(el.dataset.id);

  }else if((e.key === "Escape" || e.key === "Tab") && isOpen){

    if(e.key === "Escape") e.preventDefault();

    closePanel();

  }

});

/* نمنع فقدان التركيز عند الضغط داخل القائمة */
servicePanel.addEventListener("mousedown",e=>{
  e.preventDefault();
});

servicePanel.addEventListener("click",e=>{

  const el = e.target.closest(".opt");

  if(el) chooseService(el.dataset.id);

});

document.addEventListener("click",e=>{

  if(isOpen && !combo.contains(e.target)){
    closePanel();
  }

});

quantityBox.addEventListener("input",()=>{
  clearInvalid(quantityBox);
  updatePrice();
});

linkBox.addEventListener("input",()=>{
  clearInvalid(linkBox);
});

searchBox.addEventListener("input",()=>{

  clearTimeout(searchTimer);

  searchTimer = setTimeout(loadServices,400);

});

$("orderBtn").addEventListener("click",submitOrder);


renderTabs();

renderChips();

loadServices();

</script>

</body>
